<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4a1128">
<title>Cellar</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header id="topbar"><h1 id="screen-title">Cellar</h1><div id="cellar-counts"></div></header>
<main>
  <section id="screen-cellar" class="screen"></section>
  <section id="screen-bottle" class="screen" hidden></section>
  <section id="screen-form" class="screen" hidden></section>
  <section id="screen-history" class="screen" hidden></section>
  <section id="screen-settings" class="screen" hidden></section>
</main>
<button id="add-bottle" aria-label="Add a bottle">+</button>
<nav id="tabs">
  <button data-screen="cellar" aria-current="true">Cellar</button>
  <button data-screen="history">History</button>
  <button data-screen="settings">Settings</button>
</nav>
<div id="toast" role="status" aria-live="polite" hidden></div>
<div id="storage-warning" hidden>Storage is unavailable — changes will not be saved.</div>
<script src="js/errors.js"></script>
<script src="js/knowledge.js"></script>
<script src="js/vintages.js"></script>
<script src="js/windows.js"></script>
<script src="js/store.js"></script>
<script src="js/photos.js"></script>
<script src="js/ai.js"></script>
<script src="js/ui/format.js"></script>
<script src="js/ui/cellar.js"></script>
<script src="js/ui/form.js"></script>
<script src="js/ui/bottle.js"></script>
<script src="js/ui/history.js"></script>
<script src="js/ui/settings.js"></script>
<script src="js/ui/router.js"></script>
<script src="js/app.js"></script>
</body>
</html>
